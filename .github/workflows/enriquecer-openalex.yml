# Refresco de evidencia desde OpenAlex.
#
# A DEMANDA, no programado (decisión 3.1 de DECISIONS.md): se dispara a mano desde la pestaña
# Actions. Cuando el proyecto tenga suficiente información se puede agregar un `schedule`.
#
# Nunca escribe sobre main: abre un Pull Request con la propuesta para que una persona la
# revise antes de que entre nada (decisión 3.2). Ningún hecho queda "confirmado" por correr
# esto -- eso sigue exigiendo revisión humana, como promete README.md.
name: Enriquecer desde OpenAlex

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  proponer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar OpenAlex y generar propuesta
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/enriquecer_openalex.py

      - name: Abrir Pull Request con la propuesta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/pending)" ]; then
            echo "Sin cambios: OpenAlex no devolvió nada nuevo. No se abre PR."
            exit 0
          fi

          FECHA=$(date +%Y-%m-%d)
          RAMA="openalex/propuesta-$FECHA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add data/pending
          git commit -m "Propuesta de enriquecimiento OpenAlex ($FECHA)"
          git push -u origin "$RAMA" --force

          ARCHIVO="data/pending/openalex-$FECHA.json"
          RESUMEN=$(python3 -c "import json;print(json.dumps(json.load(open('$ARCHIVO'))['resumen'],ensure_ascii=False,indent=2))")

          gh pr create \
            --title "Propuesta OpenAlex — $FECHA" \
            --body "$(cat <<EOF
Generado automáticamente por \`scripts/enriquecer_openalex.py\`.

**Esto es una propuesta, no un cambio aplicado.** No toca \`data/sample/perfiles-muestra.json\`.
Nada entra a la muestra hasta que una persona lo apruebe.

## Resumen

\`\`\`json
$RESUMEN
\`\`\`

## Cómo revisar

1. Abrí la pestaña **Files changed** de este PR.
2. Por cada entrada en \`propuestas\`, mirá \`razones_match\`.
3. Prestá atención especial a las marcadas con:
   - \`"match_ambiguo": true\` — había otro candidato casi igual de bueno; revisá \`candidatos_alternativos\`.
   - \`"afiliacion_no_coincide": true\` — ninguna institución de OpenAlex coincide con la afiliación de nuestra muestra. Puede ser una segunda afiliación real, o puede ser otra persona con el mismo nombre.
4. Si algo no cuadra, **cerrá el PR sin mergear** — no se pierde nada, el script se puede volver a correr.
5. Si está bien, mergealo. Eso deja la propuesta registrada en el repo, todavía como \`"confianza": "pendiente"\`.

## Lo que este PR NO hace

- No marca ningún hecho como \`confirmado\`.
- No fusiona identidades automáticamente.
- No modifica los datos que ya ve el sitio público.
EOF
)"
