# Refresco de evidencia desde OpenAlex.
#
# A DEMANDA, no programado (decisión 3.1 de DECISIONS.md): se dispara a mano desde la pestaña
# Actions. Cuando el proyecto tenga suficiente información se puede agregar un `schedule`.
#
# Nunca escribe sobre main: abre un Pull Request con la propuesta para que una persona la
# revise antes de que entre nada (decisión 3.2). Ningún hecho queda "confirmado" por correr
# esto -- eso sigue exigiendo revisión humana, como promete README.md.
name: Enriquecer desde OpenAlex

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  proponer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar OpenAlex y generar propuesta
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/enriquecer_openalex.py

      - name: Abrir Pull Request con la propuesta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/pending)" ]; then
            echo "Sin cambios: OpenAlex no devolvió nada nuevo. No se abre PR."
            exit 0
          fi

          FECHA=$(date +%Y-%m-%d)
          RAMA="openalex/propuesta-$FECHA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add data/pending
          git commit -m "Propuesta de enriquecimiento OpenAlex ($FECHA)"
          git push -u origin "$RAMA" --force

          # El cuerpo del PR se arma con un script Python en vez de un heredoc de shell:
          # el terminador de un heredoc va en columna 0, y eso cortaría este bloque "run: |"
          # de YAML (GitHub deja de parsear el workflow y desaparece workflow_dispatch).
          python3 scripts/cuerpo_pr.py "data/pending/openalex-$FECHA.json" > /tmp/pr-body.md

          # Si ya hay un PR abierto para esta rama, se actualiza su cuerpo en vez de fallar:
          # re-correr el workflow el mismo día es el caso normal, no un error.
          if gh pr view "$RAMA" --json number >/dev/null 2>&1; then
            gh pr edit "$RAMA" --body-file /tmp/pr-body.md
            echo "PR ya existente actualizado: $(gh pr view "$RAMA" --json url --jq .url)"
          else
            gh pr create \
              --title "Propuesta OpenAlex — $FECHA" \
              --body-file /tmp/pr-body.md
          fi
