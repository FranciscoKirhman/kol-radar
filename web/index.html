<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOL Radar — Cáncer de pulmón (demo)</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #ffffff;
    --surface-1: #f7f6f3;
    --surface-2: #eeece6;
    --border: #e2e0da;
    --text-primary: #16150f;
    --text-secondary: #52514e;
    --text-muted: #85837c;
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --persona: #2a78d6;
    --institucion: #eb6834;
    --ensayo: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #232320;
      --border: #34332e;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #85837c;
      --accent: #3987e5;
      --persona: #3987e5;
      --institucion: #d95926;
      --ensayo: #199e70;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--surface-1);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface-0);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .topbar-row { display: flex; align-items: center; gap: 10px; max-width: 1080px; margin: 0 auto; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .specialty-badge {
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    background: var(--surface-2); border-radius: 999px; padding: 3px 10px;
    white-space: nowrap;
  }
  .search-wrap { flex: 1 1 220px; min-width: 180px; position: relative; }
  .search-wrap input {
    width: 100%; font: inherit; font-size: 14px; padding: 9px 12px 9px 34px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1);
    color: var(--text-primary);
  }
  .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-wrap .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }

  .filters-row {
    display: flex; gap: 6px; padding: 10px 16px; max-width: 1080px; margin: 0 auto;
    overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  }
  .filters-row::-webkit-scrollbar { display: none; }
  .chip {
    font: inherit; font-size: 12.5px; white-space: nowrap; padding: 6px 12px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface-0);
    color: var(--text-secondary); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-0); border-color: var(--text-primary); }
  .chip.spacer { margin-left: auto; }
  .chip.network-toggle { color: var(--accent); border-color: var(--accent); }

  /* ---------- Main / list ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 6px 16px 48px; }
  .results-meta { font-size: 12.5px; color: var(--text-muted); margin: 6px 2px 12px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .cards { grid-template-columns: repeat(3, 1fr); } }

  .card {
    text-align: left; width: 100%; font: inherit; cursor: pointer;
    background: var(--surface-0); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 14px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .12s, transform .12s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .card:active { transform: scale(0.99); }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .type-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; }
  .type-dot.persona { background: var(--persona); }
  .type-dot.institucion { background: var(--institucion); }
  .type-dot.ensayo { background: var(--ensayo); }
  .card-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .card-sub { font-size: 12.5px; color: var(--text-secondary); }
  .card-meta { font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--surface-2); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13.5px; }

  /* ---------- Network view ---------- */
  #network-view { display: none; }
  #network-view.active { display: block; }
  #network-view svg { width: 100%; height: auto; display: block; background: var(--surface-0); border: 1px solid var(--border); border-radius: 10px; }
  .network-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); padding: 10px 4px 0; }
  .network-legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .node-circle { cursor: pointer; stroke: var(--surface-0); stroke-width: 2px; }
  .node-circle:hover { stroke: var(--text-primary); }
  .edge-line { stroke: var(--border); stroke-width: 1.4px; }
  .node-label { font-size: 9px; fill: var(--text-secondary); pointer-events: none; }
  #list-view.active { display: block; }
  #list-view { display: none; }

  /* ---------- Detail sheet / panel ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .detail-sheet {
    position: fixed; z-index: 50; background: var(--surface-0);
    left: 0; right: 0; bottom: 0; max-height: 85vh;
    border-radius: 16px 16px 0 0; border: 1px solid var(--border); border-bottom: none;
    transform: translateY(100%); transition: transform .18s ease-out;
    overflow-y: auto; padding: 10px 20px 28px;
  }
  .detail-sheet.open { transform: translateY(0); }
  @media (min-width: 720px) {
    .detail-sheet {
      left: auto; top: 0; bottom: 0; right: 0; max-height: none;
      width: 400px; border-radius: 0; border: none; border-left: 1px solid var(--border);
      transform: translateX(100%);
    }
    .detail-sheet.open { transform: translateX(0); }
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--surface-2); margin: 0 auto 10px; }
  @media (min-width: 720px) { .sheet-handle { display: none; } }
  .sheet-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 18px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
  .sheet-name { font-size: 18px; font-weight: 700; margin: 4px 0 4px; padding-right: 28px; }
  .sheet-type-tag { display: inline-block; font-size: 11px; color: var(--text-secondary); background: var(--surface-2); border-radius: 4px; padding: 2px 8px; margin-bottom: 4px; }
  .sheet-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .sheet-section-title { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin: 0 0 8px; }
  .hecho-list { list-style: none; margin: 0 0 4px; padding: 0; }
  .hecho-item { padding: 12px 0; border-top: 1px solid var(--surface-2); font-size: 13.5px; line-height: 1.5; }
  .hecho-item:first-child { border-top: none; }
  .hecho-fecha { display: block; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .hecho-fecha a { color: var(--accent); text-decoration: none; margin-left: 4px; }
  .hecho-fecha a:hover { text-decoration: underline; }
  .confianza-note { font-size: 11.5px; color: var(--text-muted); background: var(--surface-1); border-radius: 6px; padding: 8px 10px; margin-top: 14px; }

  footer.page-footer { max-width: 1080px; margin: 20px auto 0; padding: 16px; text-align: center; font-size: 12px; color: var(--text-muted); }
  footer.page-footer a { color: var(--text-secondary); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <span class="brand">KOL Radar</span>
    <span class="specialty-badge">Cáncer de pulmón · demo</span>
    <div class="search-wrap">
      <span class="icon">⌕</span>
      <input id="search" type="search" placeholder="Buscar por nombre, institución o ciudad…" autocomplete="off" />
    </div>
  </div>
  <div class="filters-row">
    <button class="chip" data-filter="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-filter="persona" aria-pressed="false">Personas</button>
    <button class="chip" data-filter="institucion" aria-pressed="false">Instituciones</button>
    <button class="chip" data-filter="ensayo" aria-pressed="false">Ensayos clínicos</button>
    <button class="chip network-toggle spacer" id="toggle-network" aria-pressed="false">Ver red de conexiones</button>
  </div>
</header>

<main>
  <section id="list-view" class="active">
    <p class="results-meta" id="results-meta"></p>
    <div class="cards" id="cards"></div>
    <div class="empty-state" id="empty-state" hidden>Sin resultados para esa búsqueda.</div>
  </section>

  <section id="network-view">
    <svg id="graph" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="network-legend">
      <span><span class="swatch" style="background:var(--persona)"></span>Persona</span>
      <span><span class="swatch" style="background:var(--institucion)"></span>Institución</span>
      <span><span class="swatch" style="background:var(--ensayo)"></span>Ensayo clínico</span>
    </div>
  </section>
</main>

<footer class="page-footer">
  Datos de muestra (sin revisión humana todavía) · <a href="../DATA_SAMPLE.md">de dónde salen</a> · <a href="interno.html">cómo se construyó esto</a>
</footer>

<div class="backdrop" id="backdrop"></div>
<div class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheet-close" aria-label="Cerrar">✕</button>
  <div id="detail-content"></div>
</div>

(function () {

    ]},

      { t: "Sitio activo en 3 ensayos clínicos distintos sobre NSCLC (WU-KONG1, REZILIENT3, BE6A LUNG-02). Aparece con 4 nombres distintos entre fuentes — ver nota de normalización en DATA_SAMPLE.md.", u: "https://clinicaltrials.gov/study/NCT06758401", f: "2026-07-22" }

    ]}
  ];

    ["carlos-rojas", "nct06890598"],
    ["rodrigo-uribe", "falp"], ["rodrigo-uribe", "nct06890598"],

    ["andres-rojas", "hosp-puerto-montt"],
    ["fernando-saldias", "puc"], ["javiera-martinez", "puc"]
  ];

  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });

  function sortableDate(fecha) {
    var m = fecha && fecha.match(/(\d{4})(-(\d{2}))?(-(\d{2}))?/);
    if (!m) return "0000-00-00";
    return m[1] + "-" + (m[3] || "01") + "-" + (m[5] || "01");
  }
  function mostRecentHecho(n) {
    var best = n.hechos[0], bestKey = sortableDate(best.f);
    n.hechos.forEach(function (h) {
      var k = sortableDate(h.f);
      if (k > bestKey) { bestKey = k; best = h; }
    });
    return best;
  }

  var typeLabel = { persona: "Persona", institucion: "Institución", ensayo: "Ensayo clínico" };

  // ---- Render cards ----
  var state = { filter: "todos", query: "" };
  var cardsEl = document.getElementById("cards");
  var metaEl = document.getElementById("results-meta");
  var emptyEl = document.getElementById("empty-state");

  function matches(n) {
    if (state.filter !== "todos" && n.type !== state.filter) return false;
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    return n.label.toLowerCase().indexOf(q) !== -1 ||
           n.ciudad.toLowerCase().indexOf(q) !== -1 ||
           n.sub.toLowerCase().indexOf(q) !== -1;
  }

  function renderCards() {
    var list = nodes.filter(matches).sort(function (a, b) {
      return sortableDate(mostRecentHecho(b).f).localeCompare(sortableDate(mostRecentHecho(a).f));
    });
    cardsEl.innerHTML = "";
    metaEl.textContent = list.length + (list.length === 1 ? " resultado" : " resultados");
    emptyEl.hidden = list.length !== 0;
    list.forEach(function (n) {
      var card = document.createElement("button");
      card.className = "card";
      card.setAttribute("data-id", n.id);

      var top = document.createElement("div"); top.className = "card-top";
      var dot = document.createElement("span"); dot.className = "type-dot " + n.type;
      var nameWrap = document.createElement("div");
      var name = document.createElement("div"); name.className = "card-name"; name.textContent = n.label;
      var sub = document.createElement("div"); sub.className = "card-sub"; sub.textContent = n.sub + " · " + n.ciudad;
      nameWrap.appendChild(name); nameWrap.appendChild(sub);
      top.appendChild(dot); top.appendChild(nameWrap);

      var meta = document.createElement("div"); meta.className = "card-meta";
      var hechosCount = document.createElement("span");
      hechosCount.textContent = n.hechos.length + (n.hechos.length === 1 ? " hecho registrado" : " hechos registrados");
      var recent = mostRecentHecho(n);
      var fecha = document.createElement("span"); fecha.textContent = recent.f === "sin fecha en la fuente" ? "sin fecha" : recent.f;
      meta.appendChild(hechosCount); meta.appendChild(fecha);

      card.appendChild(top); card.appendChild(meta);
      card.addEventListener("click", function () { openDetail(n.id); });
      cardsEl.appendChild(card);
    });
  }

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value;
    renderCards();
  });

  document.querySelectorAll(".chip[data-filter]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".chip[data-filter]").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      state.filter = btn.getAttribute("data-filter");
      renderCards();
    });
  });

  // ---- Toggle red / lista ----
  var networkBtn = document.getElementById("toggle-network");
  var listView = document.getElementById("list-view");
  var networkView = document.getElementById("network-view");
  var networkBuilt = false;

  networkBtn.addEventListener("click", function () {
    var showingNetwork = networkView.classList.toggle("active");
    listView.classList.toggle("active", !showingNetwork);
    networkBtn.setAttribute("aria-pressed", String(showingNetwork));
    networkBtn.textContent = showingNetwork ? "Ver lista" : "Ver red de conexiones";
    if (showingNetwork && !networkBuilt) { buildNetwork(); networkBuilt = true; }
  });

  // ---- Red de conexiones (simulación de fuerzas mínima, una sola vez) ----
  function buildNetwork() {
    var W = 720, H = 460;
    nodes.forEach(function (n, i) {
      var angle = (i / nodes.length) * Math.PI * 2;
      n._x = W / 2 + Math.cos(angle) * 120 + (Math.random() - 0.5) * 20;
      n._y = H / 2 + Math.sin(angle) * 120 + (Math.random() - 0.5) * 20;
      n._vx = 0; n._vy = 0;
    });
    for (var iter = 0; iter < 260; iter++) {
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = a._x - b._x, dy = a._y - b._y;
          var distSq = dx * dx + dy * dy || 0.01;
          var dist = Math.sqrt(distSq);
          var force = 1400 / distSq;
          var fx = (dx / dist) * force, fy = (dy / dist) * force;
          a._vx += fx; a._vy += fy; b._vx -= fx; b._vy -= fy;
        }
      }
      edges.forEach(function (e) {
        var a = byId[e[0]], b = byId[e[1]];
        var dx = b._x - a._x, dy = b._y - a._y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var force = (dist - 95) * 0.02;
        var fx = (dx / dist) * force, fy = (dy / dist) * force;
        a._vx += fx; a._vy += fy; b._vx -= fx; b._vy -= fy;
      });
      nodes.forEach(function (n) {
        n._vx += (W / 2 - n._x) * 0.0015;
        n._vy += (H / 2 - n._y) * 0.0015;
        n._x += n._vx * 0.15; n._y += n._vy * 0.15;
        n._vx *= 0.82; n._vy *= 0.82;
        n._x = Math.max(30, Math.min(W - 30, n._x));
        n._y = Math.max(20, Math.min(H - 20, n._y));
      });
    }

    var svg = document.getElementById("graph");
    var NS = "http://www.w3.org/2000/svg";
    edges.forEach(function (e) {
      var a = byId[e[0]], b = byId[e[1]];
      var line = document.createElementNS(NS, "line");
      line.setAttribute("class", "edge-line");
      line.setAttribute("x1", a._x); line.setAttribute("y1", a._y);
      line.setAttribute("x2", b._x); line.setAttribute("y2", b._y);
      svg.appendChild(line);
    });
    nodes.forEach(function (n) {
      var r = n.type === "persona" ? 6 : n.type === "institucion" ? 8 : 7;
      var circle = document.createElementNS(NS, "circle");
      circle.setAttribute("class", "node-circle");
      circle.setAttribute("cx", n._x); circle.setAttribute("cy", n._y);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", "var(--" + n.type + ")");
      circle.addEventListener("click", function () { openDetail(n.id); });
      svg.appendChild(circle);

      var label = document.createElementNS(NS, "text");
      label.setAttribute("class", "node-label");
      label.setAttribute("x", n._x + r + 3);
      label.setAttribute("y", n._y + 3);
      label.textContent = n.label.length > 24 ? n.label.slice(0, 22) + "…" : n.label;
      svg.appendChild(label);
    });
  }

  // ---- Detail sheet ----
  var backdrop = document.getElementById("backdrop");
  var sheet = document.getElementById("detail-sheet");
  var content = document.getElementById("detail-content");

  function openDetail(id) {
    var n = byId[id];
    content.innerHTML = "";
    var tag = document.createElement("span"); tag.className = "sheet-type-tag"; tag.textContent = typeLabel[n.type];
    var name = document.createElement("div"); name.className = "sheet-name"; name.textContent = n.label;
    var sub = document.createElement("div"); sub.className = "sheet-sub"; sub.textContent = n.sub + " · " + n.ciudad;
    var sectionTitle = document.createElement("div"); sectionTitle.className = "sheet-section-title";
    sectionTitle.textContent = "Evidencia (" + n.hechos.length + ")";
    content.appendChild(tag); content.appendChild(name); content.appendChild(sub); content.appendChild(sectionTitle);

    var ul = document.createElement("ul"); ul.className = "hecho-list";
    n.hechos.slice().sort(function (a, b) { return sortableDate(b.f).localeCompare(sortableDate(a.f)); }).forEach(function (h) {
      var li = document.createElement("li"); li.className = "hecho-item";
      li.appendChild(document.createTextNode(h.t));
      var fechaLine = document.createElement("span"); fechaLine.className = "hecho-fecha";
      fechaLine.textContent = (h.f === "sin fecha en la fuente" ? "sin fecha en la fuente" : h.f);
      var a = document.createElement("a"); a.href = h.u; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ver fuente →";
      fechaLine.appendChild(a);
      li.appendChild(fechaLine);
      ul.appendChild(li);
    });
    content.appendChild(ul);

    var note = document.createElement("div"); note.className = "confianza-note";
    note.textContent = "Confianza: pendiente de revisión humana. Esto es una muestra de datos públicos, no una evaluación de desempeño profesional.";
    content.appendChild(note);

    backdrop.classList.add("open");
    sheet.classList.add("open");
  }

  function closeDetail() {
    backdrop.classList.remove("open");
    sheet.classList.remove("open");
  }
  document.getElementById("sheet-close").addEventListener("click", closeDetail);
  backdrop.addEventListener("click", closeDetail);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });

  renderCards();
})();
</script>
</body>
</html>
